<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>College Helpdesk Chatbot</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<main>
  <h1>College Helpdesk Chatbot</h1>
  <p class="sub">Ask about admissions, exams, hostel, library, fees, or scholarships. Answers come from the college documents, with sources.</p>

  <div id="chat" class="chat"></div>

  <div class="row">
    <input id="q" type="text" placeholder="Ask a question..." autocomplete="off">
    <button id="askBtn" type="button">Ask</button>
  </div>

  <p class="samples">Try:
    <button class="sample" type="button">What are the library hours?</button>
    <button class="sample" type="button">How do I apply for a scholarship?</button>
    <button class="sample" type="button">What documents are needed for admission?</button>
  </p>
</main>
<script src="/static/app.js"></script>
</body>
</html>
